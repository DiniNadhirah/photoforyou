# Local cluster with Docker Desktop (Windows / Mac / Linux):
#   docker compose up --build        then open http://localhost:8080
#   docker compose stop app-b         (simulate a crash -> traffic moves to A and C)
# Runs 3 app instances + nginx load balancer, with the local storage backend
# (no Supabase needed). Use .env to point the instances at Supabase instead.
x-app: &app
  build: .
  environment: &env
    STORAGE_BACKEND: local
    LOCAL_DATA_DIR: /data
    SECRET_KEY: compose-shared-secret-change-me
    LB_TOKEN: compose-lb-token
    WEB_CONCURRENCY: "1"
    THREADS: "4"
  volumes:
    - appdata:/data
  restart: unless-stopped

services:
  app-a:
    <<: *app
    environment: { <<: *env, INSTANCE_NAME: A }
  app-b:
    <<: *app
    environment: { <<: *env, INSTANCE_NAME: B }
  app-c:
    <<: *app
    environment: { <<: *env, INSTANCE_NAME: C }
  lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app-a, app-b, app-c]

volumes:
  appdata:
