{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block body_class %}auth{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>Welcome back</h1>
  <p class="muted">Log in to open your private photo vault.</p>
  {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
  <form method="post" autocomplete="on">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">Username or email</label>
    <input id="username" name="username" type="text" value="{{ username or '' }}" required autocomplete="username">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <button type="submit" class="btn">Log in</button>
  </form>
  <p class="muted small">No account yet? <a href="{{ url_for('register') }}">Sign up</a></p>
</section>
{% endblock %}
